<title>ROAMA для партнерів</title>
<style>
:root{--bg:#f5f2ea;--ink:#121212;--muted:#56544e;--accent:#121212;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#f5f2ea;--muted:#aeaba2;--accent:#ffc83d}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);padding:16px}
main{max-width:420px;text-align:center}b{font-size:20px;letter-spacing:.02em}p{color:var(--muted)}
a{color:var(--accent);display:inline-flex;align-items:center;min-height:44px}
</style>
</head>
<body>
<main>
<b>ROAMA для партнерів</b>
<p id="state">Перевіряю, чи кабінет на зв'язку…</p>
<noscript><p><a href="https://supports-marilyn-solid-experimental.trycloudflare.com/login">Відкрити кабінет</a></p></noscript>
</main>
<script>
(function () {
  var target = "https://supports-marilyn-solid-experimental.trycloudflare.com";
  var health = "https://supports-marilyn-solid-experimental.trycloudflare.com/health";
  var state = document.getElementById("state");
  var stop = new AbortController();
  var timer = setTimeout(function () { stop.abort(); }, 6000);
  fetch(health, { signal: stop.signal, cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (body) {
      clearTimeout(timer);
      if (body && body.ok === true) { location.replace(target + "/login"); return; }
      throw new Error("down");
    })
    .catch(function () { state.textContent = "Кабінет зараз недоступний, спробуйте пізніше."; });
})();
</script>
